# Reviewed distribution choices, adapted from herdr-gpui. Accepted licenses are in
# preference order (Apache first for dual-licensed crates). Targets are the release
# targets; build/dev dependencies and all features are a conservative superset.
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
  # webpki-roots trust-store data; section 2.1 requires this text with data.
  "CDLA-Permissive-2.0",
  "WTFPL", # terminfo 0.9.0
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

# MPL is file-level copyleft, not a global permissive-license exception. This
# unmodified dependency retains MPL and has an exact source link in the report.
# Re-review this exception and source availability when Cargo.lock changes.
# https://crates.io/api/v1/crates/option-ext/0.2.0/download
[option-ext]
accepted = ["MPL-2.0"] # 0.2.0, runtime dependency
