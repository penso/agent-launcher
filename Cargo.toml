[workspace]
members = [
  "crates/core",
  "crates/tui",
  "crates/cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
