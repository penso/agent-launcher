[workspace]
members = [
  "crates/cli",
  "crates/core",
  "crates/issues",
  "crates/runner",
  "crates/runtime",
  "crates/store",
  "crates/tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
async-trait        = "0.1"
chrono             = { features = ["serde"], version = "0.4" }
clap               = { features = ["derive"], version = "4.5" }
crossterm          = { features = ["event-stream"], version = "0.29" }
dirs               = "6.0"
futures-util       = "0.3"
fuzzy-matcher      = "0.3"
minijinja          = "2"
notify-rust        = "4.11"
ratatui            = "0.30"
reqwest            = { default-features = false, features = ["json", "rustls-tls", "stream"], version = "0.12" }
serde              = { features = ["derive"], version = "1.0" }
serde_json         = "1.0"
sqlx               = { default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio-rustls", "sqlite"], version = "0.8" }
sysinfo            = { default-features = false, features = ["system"], version = "0.37.2" }
thiserror          = "2.0"
tokio              = { features = ["full"], version = "1.45" }
tokio-stream       = "0.1"
toml               = "0.8"
tracing            = "0.1"
tracing-subscriber = { features = ["env-filter", "fmt"], version = "0.3" }
url                = "2.5"
uuid               = { features = ["serde", "v4"], version = "1" }
