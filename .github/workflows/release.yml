name: Release
run-name: Release @ ${{ inputs.expected_sha }} [${{ inputs.request_id }}]

# Dispatched by `just release` (scripts/release/dispatch.sh); never by a push.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of main HEAD
        required: true
        type: string
      request_id:
        description: Optional unique dispatch correlation ID (set by just release)
        required: false
        default: ''
        type: string

permissions: {}

# Serialize publication and tap updates across versions; never cancel a publish.
concurrency:
  group: manual-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Release Workflow Security
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/agent-launcher' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          online-audits: false

  validate:
    needs: audit
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'penso/agent-launcher' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9-]{0,64}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          [[ "$(gh api repos/penso/agent-launcher/git/ref/heads/main --jq .object.sha)" == "$EXPECTED_SHA" ]]
          # The calendar version is derived here, never dispatched: today's UTC
          # date and the next same-day counter after the tags GitHub already has.
          version=$(gh api --paginate repos/penso/agent-launcher/git/matching-refs/tags/v --jq '.[].ref' |
            python3 scripts/release/next-version.py "$(date -u +%Y%m%d)")
          [[ "$version" =~ ^[1-9][0-9]{7}\.[1-9][0-9]*$ ]]
          printf 'version=%s\nsha=%s\n' "$version" "$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          printf 'Publishing v%s\n' "$version"

  # One report for every archive: cargo-about over the locked graph for all
  # release targets (scripts/release/about.toml).
  notices:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      # cargo-about gates its binary behind the non-default `cli` feature, and
      # `cargo install` only warns and exits 0 when it installs nothing. Verify
      # the subcommand resolves here rather than failing in the next step.
      - name: Install the notice generator
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about --version
      - run: python3 scripts/release/generate-notices.py THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: ${{ matrix.target }}
      AGENT_LAUNCHER_VERSION: ${{ needs.validate.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup show
      - name: Require the declared native target
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p agent-launcher-cli --target "$TARGET"
      - name: Require the release version in the executable
        run: |
          set -euo pipefail
          test "$("target/$TARGET/release/agent-launcher" --version)" = "agent-launcher $VERSION"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: third-party-notices
          path: notices
      - name: Package the executable
        run: |
          mkdir dist
          bash scripts/release/package.sh "$VERSION" "$TARGET" "target/$TARGET/release/agent-launcher" dist \
            notices/THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.target }}
          path: dist/agent-launcher-${{ needs.validate.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # One macOS archive for both architectures keeps the formula simple.
  macos-universal:
    needs: [validate, build]
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # No token/run-id override: artifacts can only come from this workflow run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-aarch64-apple-darwin
          path: thin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-x86_64-apple-darwin
          path: thin
      - name: Merge both architectures without executing the downloads
        run: |
          set -euo pipefail
          for arch in aarch64 x86_64; do
            mkdir -p "thin/$arch"
            tar -xzf "thin/agent-launcher-$VERSION-$arch-apple-darwin.tar.gz" -C "thin/$arch"
          done
          lipo -create -output agent-launcher \
            "thin/aarch64/agent-launcher-$VERSION-aarch64-apple-darwin/bin/agent-launcher" \
            "thin/x86_64/agent-launcher-$VERSION-x86_64-apple-darwin/bin/agent-launcher"
          test "$(lipo -archs agent-launcher | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "
          mkdir dist
          bash scripts/release/package.sh "$VERSION" universal-apple-darwin agent-launcher dist \
            "thin/aarch64/agent-launcher-$VERSION-aarch64-apple-darwin/THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-universal-apple-darwin
          path: dist/agent-launcher-${{ needs.validate.outputs.version }}-universal-apple-darwin.tar.gz
          if-no-files-found: error
          retention-days: 7

  changelog:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          # Release notes are derived from history, which a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - run: cargo install git-cliff --locked --version 2.12.0
      - name: Generate the changelog and release notes from git history
        run: |
          mkdir release-notes
          bash scripts/release/generate-changelog.sh "$VERSION" release-notes
          cat release-notes/RELEASE_NOTES.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: |
            release-notes/CHANGELOG.md
            release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, build, macos-universal, changelog]
    if: >-
      github.repository == 'penso/agent-launcher' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_SHA: ${{ needs.validate.outputs.sha }}
      GH_REPO: penso/agent-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      # Kept out of dist: the release body is not one of the published assets.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-notes
      - name: Require exactly the expected archives and checksum them
        run: |
          set -euo pipefail
          expected=$(for target in universal-apple-darwin aarch64-apple-darwin x86_64-apple-darwin \
              x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            printf 'agent-launcher-%s-%s.tar.gz\n' "$VERSION" "$target"; done | sort)
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)" = "$expected"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Refuse existing tag or release, then create immutable tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for path in "git/ref/tags/v$VERSION" "releases/tags/v$VERSION"; do
            if gh api "repos/penso/agent-launcher/$path" --silent 2>/dev/null; then
              echo "Refusing existing $path" >&2
              exit 1
            fi
          done
          gh api repos/penso/agent-launcher/git/refs -X POST \
            -f "ref=refs/tags/v$VERSION" -f "sha=$RELEASE_SHA"
          gh release create "v$VERSION" --verify-tag --target "$RELEASE_SHA" --draft \
            --title "agent-launcher $VERSION" \
            --notes-file release-notes/RELEASE_NOTES.md \
            dist/*
      - name: Verify uploaded draft bytes and exact asset set before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | jq -R . | jq -s .)
          gh release view "v$VERSION" --json isDraft,assets | \
            jq -e --argjson expected "$expected" \
              '.isDraft and (([.assets[].name] | sort) == ($expected | sort))'
          gh release download "v$VERSION" --dir verified
          cmp dist/SHA256SUMS verified/SHA256SUMS
          (cd verified && sha256sum --check --strict SHA256SUMS)
          [[ "$(gh api "repos/penso/agent-launcher/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release edit "v$VERSION" --draft=false

  homebrew:
    needs: [validate, publish]
    if: >-
      github.repository == 'penso/agent-launcher' && github.ref == 'refs/heads/main' &&
      github.actor == 'penso' && github.triggering_actor == 'penso'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: homebrew
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: penso/agent-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      # The tap is public: a formula pointing at a private repository's assets
      # would fail to download for everyone, so wait until the repository is.
      - name: Require a public repository
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility=$(gh api repos/penso/agent-launcher --jq .visibility)
          echo "public=$([[ $visibility == public ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if [[ $visibility != public ]]; then
            echo "::notice::Skipping the Homebrew tap: penso/agent-launcher is $visibility."
          fi
      - name: Render the formula from the published checksums
        if: steps.visibility.outputs.public == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" --json isDraft | jq -e '.isDraft == false'
          [[ "$(gh api "repos/penso/agent-launcher/git/ref/tags/v$VERSION" --jq .object.sha)" == "$RELEASE_SHA" ]]
          gh release download "v$VERSION" --dir final --pattern SHA256SUMS
          bash scripts/release/render-formula.sh "$VERSION" final/SHA256SUMS > rendered-formula.rb
          cat rendered-formula.rb
      - name: Commit only the tap formula using its dedicated deploy key
        if: steps.visibility.outputs.public == 'true'
        env:
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
        run: bash scripts/release/update-homebrew.sh "$VERSION" rendered-formula.rb
