[package]
edition.workspace = true
license.workspace = true
name              = "agent-launcher-cli"
version.workspace = true

[[bin]]
name = "agent-launcher"
path = "src/main.rs"

[features]
default = ["tui"]
tui     = ["dep:agent-launcher-tui", "dep:tokio"]

[dependencies]
agent-launcher-core    = { path = "../core" }
agent-launcher-issues  = { path = "../issues" }
agent-launcher-runner  = { path = "../runner" }
agent-launcher-runtime = { path = "../runtime" }
agent-launcher-store   = { path = "../store" }
agent-launcher-tui     = { optional = true, path = "../tui" }
clap.workspace         = true
dirs.workspace         = true
thiserror.workspace    = true
tokio                  = { optional = true, workspace = true }
toml.workspace         = true
uuid                   = { features = ["v5"], workspace = true }
